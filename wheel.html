<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wheel</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; background: #fff; }
  #stage { position: relative; }
  canvas { display: block; }
  #spin {
    position: absolute; transform: translate(-50%, -50%);
    border: 0; border-radius: 50%; background: #222; color: #fff;
    font: 600 16px system-ui, sans-serif; cursor: pointer;
  }
  #open {
    position: fixed; right: 12px; bottom: 12px; width: 28px; height: 28px;
    padding: 0; border: 1.5px solid #666; border-radius: 50%; background: #fff; color: #555;
    cursor: pointer; opacity: .8;
  }
  #open:hover { opacity: 1; }
  #open svg { display: block; margin: auto; }
  #close {
    position: absolute; top: 6px; right: 8px; padding: 0 6px;
    border: 0; background: none; color: #222; font: 28px/1 system-ui, sans-serif; cursor: pointer;
  }
  dialog {
    width: min(440px, calc(100vw - 40px)); box-sizing: border-box; padding: 20px;
    border: 2px solid #666; border-radius: 8px; color: #222; font: 14px/1.5 system-ui, sans-serif;
  }
  dialog::backdrop { background: rgba(255, 255, 255, .75); }
  dialog label { display: block; margin-top: 14px; font-weight: 600; }
  dialog textarea, dialog input { width: 100%; box-sizing: border-box; font: inherit; }
  dialog p { margin: 14px 0 0; }
  .row { display: flex; gap: 6px; }
  .row input { flex: 1; min-width: 0; }
</style>
</head>
<body>
<div id="stage"><canvas></canvas><button id="spin">Spin</button></div>
<button id="open" title="Options &amp; info">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <circle cx="12" cy="12" r="6.5" stroke-width="3"/>
    <circle cx="12" cy="12" r="9.5" stroke-width="3" stroke-dasharray="3.73 3.73"/>
  </svg>
</button>

<dialog id="dialog">
  <button id="close" aria-label="Close">&times;</button>
  <label for="list">Options (one per line)</label>
  <textarea id="list" rows="6" spellcheck="false"></textarea>
  <label for="url">URL for the current options</label>
  <div class="row"><input id="url" readonly><button id="copy">Copy</button></div>
  <p>
    Copy the URL above to reuse or share your options.
  </p>
  <p>
    Released under the MIT License.<br>
    <a href="https://github.com/wepal/wheel" target="_blank" rel="noopener">GitHub repository</a>
  </p>
</dialog>

<script>
"use strict";
// Usage: wheel.html?options=Pizza,Pasta,Sushi  (or repeated: ?options=A&options=B)
const values = new URLSearchParams(location.search).getAll("options");
const initial = (values.length === 1 ? values[0].split(",") : values).map(s => s.trim()).filter(Boolean);

// ---- Geometry (logical units; wheel center at CX/CY) ----
const W = 540, H = 600, CX = W / 2, CY = 334;
const R = 250, RP = 253, PEG = 4.5, HUB = 42;   // wheel, peg circle, peg radius, button
const TEXT_OUT = R * 0.93, TEXT_IN = HUB * 1.25;
const TAU = 2 * Math.PI;

// ---- Physics ----
let inertia;                           // moment of inertia, grows with the option count (see setOptions)
const DRY = 0.16, VISC = 0.15;         // axle friction: dry (rad/s²) and viscous (1/s)
const L = 70, TIP = 2, PIVOT_Y = -RP - L + 1;  // flap: length, tip radius, mounting point
const K = 4000, C = 19;                // flap bending stiffness and damping (tip mass 1)
const KC = 1e6, CC = 600;              // peg/flap contact stiffness and damping
const DT = 1 / 5000;

let options, n, seg, fontSize;                 // current options, their count, segment angle, shared font size
let theta = Math.random() * TAU, omega = 0;    // wheel angle (clockwise) and angular velocity
let x = 0, xd = 0;                             // sideways deflection of the flap tip and its velocity
let last = 0, acc = 0, still = 0, scale = 1;

const stage = document.getElementById("stage");
const canvas = document.querySelector("canvas");
const btn = document.getElementById("spin");
const dialog = document.getElementById("dialog");
const list = document.getElementById("list");
const url = document.getElementById("url");
const ctx = canvas.getContext("2d");

const font = size => `500 ${size}px system-ui, sans-serif`;
const wrap = a => a - TAU * Math.round(a / TAU);

// Applies a new option list and picks one font size so that every option fits radially into its segment.
function setOptions(next) {
  options = next;
  n = next.length;
  seg = TAU / n;
  inertia = 10 * n * RP * RP;   // more pegs = more flap drag per turn; a heavier wheel keeps the spin time about constant
  ctx.font = font(100);
  const g = 1.8 * Math.sin(Math.min(seg, Math.PI) / 2);   // usable segment width per unit of radius
  fontSize = Math.min(R * 0.16, ...options.map(o => {
    const m = ctx.measureText(o).width / 100;             // text width per unit of font size
    return Math.min(g * TEXT_OUT / (1.25 + g * m), (TEXT_OUT - TEXT_IN) / m);
  }));
}

function optionsUrl() {
  const q = options.some(o => o.includes(","))
    ? options.map(o => "options=" + encodeURIComponent(o)).join("&")
    : "options=" + options.map(encodeURIComponent).join(",");
  return location.href.split(/[?#]/)[0] + "?" + q;
}

function step() {
  const s = Math.sqrt(L * L - x * x), ty = PIVOT_Y + s, slope = -x / s;  // the tip moves on a circular arc
  let fx = -K * x - C * xd, torque = 0;
  for (let j = 0; j < n; j++) {
    const f = wrap(theta + j * seg);                    // peg angle relative to "top"
    if (Math.abs(f) > 0.6) continue;
    const c = Math.cos(f), sn = Math.sin(f);
    const dx = x - RP * sn, dy = ty + RP * c, d = Math.hypot(dx, dy), pen = PEG + TIP - d;
    if (pen <= 0) continue;
    const nx = dx / d, ny = dy / d;
    const vn = (xd - omega * RP * c) * nx + (slope * xd - omega * RP * sn) * ny;
    const F = Math.max(0, KC * pen - CC * vn);          // contact force (spring + damper)
    fx += F * (nx + slope * ny);                        // acts on the flap tip
    torque -= F * RP * (nx * c + ny * sn);              // reaction force brakes the wheel
  }
  xd += fx * DT;
  x = Math.max(-0.9 * L, Math.min(0.9 * L, x + xd * DT));
  omega += (torque / inertia - DRY * Math.tanh(omega / 0.05) - VISC * omega) * DT;
  theta += omega * DT;
}

function draw() {
  const dpr = devicePixelRatio || 1;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.translate(CX, CY);

  ctx.save();
  ctx.rotate(theta);
  ctx.font = font(fontSize);
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  options.forEach((o, i) => {
    const a0 = i * seg - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, R, a0, a0 + seg);
    ctx.fillStyle = `hsl(${360 * i / n} 55% 85%)`;
    ctx.fill();
    ctx.save();
    ctx.rotate(a0 + seg / 2);                            // text runs radially outward
    ctx.fillStyle = "#222";
    ctx.fillText(o, TEXT_OUT, 0);
    ctx.restore();
  });
  ctx.strokeStyle = ctx.fillStyle = "#333";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, TAU);
  ctx.stroke();
  for (let j = 0; j < n; j++) {                          // pegs between the options
    ctx.save();
    ctx.rotate(j * seg);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, -RP);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, -RP, PEG, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  ctx.beginPath();
  ctx.arc(0, 0, 10, 0, TAU);
  ctx.fill();
  ctx.restore();

  // Flexible flap: bending curve of a cantilever beam with tip deflection x
  const s = Math.sqrt(L * L - x * x);
  ctx.strokeStyle = ctx.fillStyle = "#c0392b";
  ctx.lineWidth = 4;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  for (let u = 0; u <= 1.001; u += 0.1) {
    ctx[u ? "lineTo" : "moveTo"](x * (3 * u * u - u ** 3) / 2, PIVOT_Y + s * u);
  }
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, PIVOT_Y, 6, 0, TAU);
  ctx.fill();
}

function layout() {
  const dpr = devicePixelRatio || 1;
  scale = Math.min(innerWidth / W, innerHeight / H);
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  stage.style.width = canvas.style.width = W * scale + "px";
  stage.style.height = canvas.style.height = H * scale + "px";
  Object.assign(btn.style, {
    left: CX * scale + "px", top: CY * scale + "px",
    width: 2 * HUB * scale + "px", height: 2 * HUB * scale + "px",
    fontSize: 0.44 * HUB * scale + "px",
  });
  draw();
}

function frame(now) {
  acc += Math.min(Math.max((now - last) / 1000, 0), 0.05);
  last = now;
  for (; acc >= DT; acc -= DT) {
    step();
    still = Math.abs(omega) < 0.01 && Math.abs(xd) < 1 ? still + DT : 0;
  }
  draw();
  if (still > 0.3) {                                     // wheel stopped, flap rests between two pegs
    omega = 0;
    theta = wrap(theta);
    btn.hidden = false;
  } else {
    requestAnimationFrame(frame);
  }
}

btn.onclick = () => {
  omega = 10 + 6 * Math.random();
  btn.hidden = true;
  last = performance.now();
  acc = still = 0;
  requestAnimationFrame(frame);
};

document.getElementById("open").onclick = () => {
  list.value = options.join("\n");
  url.value = optionsUrl();
  dialog.showModal();
};
list.oninput = () => {
  const next = list.value.split("\n").map(s => s.trim()).filter(Boolean);
  if (next.length) setOptions(next);                     // keep the old options while the field is empty
  url.value = optionsUrl();
  draw();
};
document.getElementById("close").onclick = () => dialog.close();
url.onfocus = () => url.select();
document.getElementById("copy").onclick = async e => {
  try { await navigator.clipboard.writeText(url.value); }
  catch { url.select(); document.execCommand("copy"); }   // fallback where the clipboard API is unavailable
  e.target.textContent = "Copied";
  setTimeout(() => e.target.textContent = "Copy", 1200);
};
dialog.onpointerdown = e => {                           // only a press outside the box closes it, not a drag ending there
  const r = dialog.getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dialog.close();
};
canvas.onpointerdown = () => { omega = 0; };            // pressing the spinning wheel stops it at once

addEventListener("resize", layout);
setOptions(initial.length ? initial : ["Yes", "No"]);
layout();
</script>
</body>
</html>
