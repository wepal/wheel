<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wheel</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; background: #fff; }
  #stage { position: relative; }
  canvas { display: block; }
  #spin {
    position: absolute; transform: translate(-50%, -50%);
    border: 0; border-radius: 50%; background: #222; color: #fff;
    font: 600 16px system-ui, sans-serif; cursor: pointer;
  }
  #open {
    position: fixed; right: 12px; bottom: 12px; width: 28px; height: 28px;
    padding: 0; border: 1.5px solid #666; border-radius: 50%; background: #fff; color: #555;
    cursor: pointer; opacity: .8;
  }
  #open:hover { opacity: 1; }
  #open svg { display: block; margin: auto; }
  #close {
    position: absolute; top: 6px; right: 8px; padding: 0 6px;
    border: 0; background: none; color: #222; font: 28px/1 system-ui, sans-serif; cursor: pointer;
  }
  dialog {
    width: min(440px, calc(100vw - 40px)); box-sizing: border-box; padding: 20px;
    border: 2px solid #666; border-radius: 8px; color: #222; font: 14px/1.5 system-ui, sans-serif;
  }
  dialog::backdrop { background: rgba(255, 255, 255, .75); }
  dialog label { display: block; margin-top: 14px; font-weight: 600; }
  dialog textarea { width: 100%; box-sizing: border-box; font: inherit; }
  dialog p { margin: 14px 0 0; }
</style>
</head>
<body>
<div id="stage"><canvas></canvas><button id="spin">Spin</button></div>
<button id="open" title="Options &amp; info">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <circle cx="12" cy="12" r="6.5" stroke-width="3"/>
    <circle cx="12" cy="12" r="9.5" stroke-width="3" stroke-dasharray="3.73 3.73"/>
  </svg>
</button>

<dialog id="dialog">
  <button id="close" aria-label="Close">&times;</button>
  <label for="list">Options (one per line)</label>
  <textarea id="list" rows="6" spellcheck="false"></textarea>
  <p><a id="url">URL for the current options</a></p>
  <p>
    <a href="https://github.com/wepal/wheel" target="_blank" rel="noopener">GitHub repository</a>
  </p>
</dialog>

<script>
"use strict";
// Usage: wheel.html?options=Pizza,Pasta,Sushi  (or repeated: ?options=A&options=B)
const values = new URLSearchParams(location.search).getAll("options");
const initial = (values.length === 1 ? values[0].split(",") : values).map(text => text.trim()).filter(Boolean);

// ---- Geometry (logical units; wheel center at CENTER_X/CENTER_Y) ----
const WIDTH = 540, HEIGHT = 600, CENTER_X = WIDTH / 2, CENTER_Y = 334;
const WHEEL_RADIUS = 250, PEG_CIRCLE_RADIUS = 244, PEG_RADIUS = 4.5, HUB_RADIUS = 42;   // wheel, peg circle, peg radius, button
const TEXT_OUTER = WHEEL_RADIUS * 0.93, TEXT_INNER = HUB_RADIUS * 1.25;
const FULL_TURN = 2 * Math.PI;

// ---- Physics ----
let inertia;                           // moment of inertia, grows with the option count (see setOptions)
const DRY_FRICTION = 0.16, VISCOUS_FRICTION = 0.15;   // axle friction: dry (rad/s²) and viscous (1/s)
const FLAP_LENGTH = 70, TIP_RADIUS = 2, PIVOT_Y = -PEG_CIRCLE_RADIUS - FLAP_LENGTH + 1;  // flap: length, tip radius, mounting point
const FLAP_STIFFNESS = 4000, FLAP_DAMPING = 19;       // flap bending stiffness and damping (tip mass 1)
const CONTACT_STIFFNESS = 1e6, CONTACT_DAMPING = 600; // peg/flap contact stiffness and damping
const TIME_STEP = 1 / 5000;

let options, count, segmentAngle, fontSize;    // current options, their count, segment angle, shared font size
let theta = Math.random() * FULL_TURN, omega = 0;  // wheel angle (clockwise) and angular velocity
let flapX = 0, flapVelocity = 0;               // sideways deflection of the flap tip and its velocity
let lastTime = 0, accumulator = 0, stillTime = 0, scale = 1;

const stage = document.getElementById("stage");
const canvas = document.querySelector("canvas");
const spinButton = document.getElementById("spin");
const dialog = document.getElementById("dialog");
const list = document.getElementById("list");
const urlLink = document.getElementById("url");
const context = canvas.getContext("2d");

const font = size => `500 ${size}px system-ui, sans-serif`;
const wrap = angle => angle - FULL_TURN * Math.round(angle / FULL_TURN);

// Applies a new option list and picks one font size so that every option fits radially into its segment.
function setOptions(next) {
  options = next;
  urlLink.href = optionsUrl();
  count = next.length;
  segmentAngle = FULL_TURN / count;
  inertia = 10 * count * PEG_CIRCLE_RADIUS * PEG_CIRCLE_RADIUS;   // more pegs = more flap drag per turn; a heavier wheel keeps the spin time about constant
  context.font = font(100);
  const widthFactor = 1.8 * Math.sin(Math.min(segmentAngle, Math.PI) / 2);   // usable segment width per unit of radius
  fontSize = Math.min(WHEEL_RADIUS * 0.16, ...options.map(option => {
    const textWidth = context.measureText(option).width / 100;             // text width per unit of font size
    return Math.min(widthFactor * TEXT_OUTER / (1.25 + widthFactor * textWidth), (TEXT_OUTER - TEXT_INNER) / textWidth);
  }));
}

function optionsUrl() {
  const query = options.some(option => option.includes(","))
    ? options.map(option => "options=" + encodeURIComponent(option)).join("&")
    : "options=" + options.map(encodeURIComponent).join(",");
  return location.href.split(/[?#]/)[0] + "?" + query;
}

function step() {
  const flapHeight = Math.sqrt(FLAP_LENGTH * FLAP_LENGTH - flapX * flapX), tipY = PIVOT_Y + flapHeight, slope = -flapX / flapHeight;  // the tip moves on a circular arc
  let flapForce = -FLAP_STIFFNESS * flapX - FLAP_DAMPING * flapVelocity, torque = 0;
  for (let j = 0; j < count; j++) {
    const pegAngle = wrap(theta + j * segmentAngle);    // peg angle relative to "top"
    if (Math.abs(pegAngle) > 0.6) continue;
    const cosine = Math.cos(pegAngle), sine = Math.sin(pegAngle);
    const deltaX = flapX - PEG_CIRCLE_RADIUS * sine, deltaY = tipY + PEG_CIRCLE_RADIUS * cosine;
    const distance = Math.hypot(deltaX, deltaY), penetration = PEG_RADIUS + TIP_RADIUS - distance;
    if (penetration <= 0) continue;
    const normalX = deltaX / distance, normalY = deltaY / distance;
    const normalSpeed = (flapVelocity - omega * PEG_CIRCLE_RADIUS * cosine) * normalX
      + (slope * flapVelocity - omega * PEG_CIRCLE_RADIUS * sine) * normalY;
    const contactForce = Math.max(0, CONTACT_STIFFNESS * penetration - CONTACT_DAMPING * normalSpeed);  // contact force (spring + damper)
    flapForce += contactForce * (normalX + slope * normalY);                    // acts on the flap tip
    torque -= contactForce * PEG_CIRCLE_RADIUS * (normalX * cosine + normalY * sine);  // reaction force brakes the wheel
  }
  flapVelocity += flapForce * TIME_STEP;
  flapX = Math.max(-0.9 * FLAP_LENGTH, Math.min(0.9 * FLAP_LENGTH, flapX + flapVelocity * TIME_STEP));
  omega += (torque / inertia - DRY_FRICTION * Math.tanh(omega / 0.05) - VISCOUS_FRICTION * omega) * TIME_STEP;
  theta += omega * TIME_STEP;
}

function draw() {
  const pixelRatio = devicePixelRatio || 1;
  context.setTransform(pixelRatio * scale, 0, 0, pixelRatio * scale, 0, 0);
  context.clearRect(0, 0, WIDTH, HEIGHT);
  context.translate(CENTER_X, CENTER_Y);

  context.save();
  context.rotate(theta);
  context.font = font(fontSize);
  context.textAlign = "right";
  context.textBaseline = "middle";
  options.forEach((option, i) => {
    const startAngle = i * segmentAngle - Math.PI / 2;
    context.beginPath();
    context.moveTo(0, 0);
    context.arc(0, 0, WHEEL_RADIUS, startAngle, startAngle + segmentAngle);
    context.fillStyle = `hsl(${360 * i / count} 55% 85%)`;
    context.fill();
    context.save();
    context.rotate(startAngle + segmentAngle / 2);       // text runs radially outward
    context.fillStyle = "#222";
    context.fillText(option, TEXT_OUTER, 0);
    context.restore();
  });
  context.strokeStyle = context.fillStyle = "#333";
  context.lineWidth = 3;
  context.beginPath();
  context.arc(0, 0, WHEEL_RADIUS, 0, FULL_TURN);
  context.stroke();
  for (let j = 0; j < count; j++) {                      // pegs between the options
    context.save();
    context.rotate(j * segmentAngle);
    context.beginPath();
    context.moveTo(0, 0);
    context.lineTo(0, -WHEEL_RADIUS);
    context.stroke();
    context.beginPath();
    context.arc(0, -PEG_CIRCLE_RADIUS, PEG_RADIUS, 0, FULL_TURN);
    context.fill();
    context.restore();
  }
  context.beginPath();
  context.arc(0, 0, 10, 0, FULL_TURN);
  context.fill();
  context.restore();

  // Flexible flap: bending curve of a cantilever beam with tip deflection flapX
  const flapHeight = Math.sqrt(FLAP_LENGTH * FLAP_LENGTH - flapX * flapX);
  context.strokeStyle = context.fillStyle = "#c0392b";
  context.lineWidth = 4;
  context.lineCap = "round";
  context.lineJoin = "round";
  context.beginPath();
  for (let along = 0; along <= 1.001; along += 0.1) {
    context[along ? "lineTo" : "moveTo"](flapX * (3 * along * along - along ** 3) / 2, PIVOT_Y + flapHeight * along);
  }
  context.stroke();
  context.beginPath();
  context.arc(0, PIVOT_Y, 6, 0, FULL_TURN);
  context.fill();
}

function layout() {
  const pixelRatio = devicePixelRatio || 1;
  scale = Math.min(innerWidth / WIDTH, innerHeight / HEIGHT);
  canvas.width = Math.round(WIDTH * scale * pixelRatio);
  canvas.height = Math.round(HEIGHT * scale * pixelRatio);
  stage.style.width = canvas.style.width = WIDTH * scale + "px";
  stage.style.height = canvas.style.height = HEIGHT * scale + "px";
  Object.assign(spinButton.style, {
    left: CENTER_X * scale + "px", top: CENTER_Y * scale + "px",
    width: 2 * HUB_RADIUS * scale + "px", height: 2 * HUB_RADIUS * scale + "px",
    fontSize: 0.44 * HUB_RADIUS * scale + "px",
  });
  draw();
}

function frame(now) {
  accumulator += Math.min(Math.max((now - lastTime) / 1000, 0), 0.05);
  lastTime = now;
  for (; accumulator >= TIME_STEP; accumulator -= TIME_STEP) {
    step();
    stillTime = Math.abs(omega) < 0.01 && Math.abs(flapVelocity) < 1 ? stillTime + TIME_STEP : 0;
  }
  draw();
  if (stillTime > 0.3) {                                 // wheel stopped, flap rests between two pegs
    omega = 0;
    theta = wrap(theta);
    spinButton.hidden = false;
  } else {
    requestAnimationFrame(frame);
  }
}

spinButton.onclick = () => {
  omega = 10 + 6 * Math.random();
  spinButton.hidden = true;
  lastTime = performance.now();
  accumulator = stillTime = 0;
  requestAnimationFrame(frame);
};

document.getElementById("open").onclick = () => {
  list.value = options.join("\n");
  dialog.showModal();
};
list.oninput = () => {
  const next = list.value.split("\n").map(text => text.trim()).filter(Boolean);
  if (next.length) setOptions(next);                     // keep the old options while the field is empty
  draw();
};
document.getElementById("close").onclick = () => dialog.close();
dialog.onpointerdown = event => {                       // only a press outside the box closes it, not a drag ending there
  const rect = dialog.getBoundingClientRect();
  if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
};
canvas.onpointerdown = () => { omega = 0; };            // pressing the spinning wheel stops it at once

addEventListener("resize", layout);
setOptions(initial.length ? initial : ["Yes", "No"]);
layout();
</script>
</body>
</html>
